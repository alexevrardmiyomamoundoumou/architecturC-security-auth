input {
  file {
    path => "/data/access.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:timestamp} %{WORD:user} %{WORD:action} %{DATA:resource} %{IP:ip} %{WORD:result}"
    }
  }

  date {
    match => ["timestamp", "ISO8601"]
  }

  geoip {
    source => "ip"
    target => "geoip"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "access-logs-%{+YYYY.MM.dd}"
  }
}
