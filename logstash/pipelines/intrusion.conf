input {
  file {
    path => "/data/intrusion.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:timestamp} %{IP:source_ip} %{WORD:attack_type} %{WORD:severity} %{GREEDYDATA:signature}"
    }
  }

  date {
    match => ["timestamp", "ISO8601"]
  }

  geoip {
    source => "[intrusion][src_ip]"
    target => "geo"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "intrusion-logs-%{+YYYY.MM.dd}"
  }
}
