######################
# INPUT
######################
input {

  file {
    path => "/data/auth/*.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    add_field => { "log_category" => "auth" }
  }

  file {
    path => "/data/intrusion/*.json"
    codec => json
    start_position => "beginning"
    sincedb_path => "/dev/null"
    add_field => { "log_category" => "intrusion" }
  }

  file {
    path => "/data/access/*.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    add_field => { "log_category" => "resource_access" }
  }

  file {
    path => "/data/firewall/*.json"
    codec => json
    start_position => "beginning"
    sincedb_path => "/dev/null"
    add_field => { "log_category" => "firewall_ids" }
  }

  file {
    path => "/data/audit/*.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    add_field => { "log_category" => "audit" }
  }
}

######################
# FILTER
######################
filter {

  # Auth logs
  if [log_category] == "auth" {
    csv {
      separator => ","
      columns => ["timestamp","user","source_ip","status"]
    }

    date {
      match => ["timestamp", "ISO8601"]
    }

    mutate {
      add_field => {
        "event_type" => "authentication"
      }
    }
  }

  # Intrusion logs
  if [log_category] == "intrusion" {
    date {
      match => ["timestamp", "ISO8601"]
    }

    mutate {
      add_field => {
        "event_type" => "intrusion_attempt"
      }
    }
  }

  # Resource access
  if [log_category] == "resource_access" {
    csv {
      separator => ","
      columns => ["timestamp","user","resource","action","status","source_ip"]
    }

    date {
      match => ["timestamp", "ISO8601"]
    }

    mutate {
      add_field => {
        "event_type" => "resource_access"
      }
    }
  }

  # Firewall / IDS
  if [log_category] == "firewall_ids" {
    date {
      match => ["timestamp", "ISO8601"]
    }

    mutate {
      add_field => {
        "event_type" => "firewall_alert"
      }
    }
  }

  # Audit logs
  if [log_category] == "audit" {
    csv {
      separator => ","
      columns => ["timestamp","admin","action","target"]
    }

    date {
      match => ["timestamp", "ISO8601"]
    }

    mutate {
      add_field => {
        "event_type" => "audit"
      }
    }
  }

  # Enrichissement GeoIP
  if [source_ip] {
    geoip {
      source => "source_ip"
      target => "geoip"
    }
  }

  # Gravité
  if [status] == "FAILED" {
    mutate { add_field => { "severity" => "MEDIUM" } }
  }

  if [attack_type] {
    mutate { add_field => { "severity" => "HIGH" } }
  }
}

######################
# OUTPUT
######################
output {

  if [log_category] == "auth" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "auth-logs-%{+yyyy.MM.dd}"
    }
  }

  if [log_category] == "intrusion" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "intrusion-logs-%{+yyyy.MM.dd}"
    }
  }

  if [log_category] == "resource_access" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "resource-access-logs-%{+yyyy.MM.dd}"
    }
  }

  if [log_category] == "firewall_ids" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "firewall-ids-logs-%{+yyyy.MM.dd}"
    }
  }

  if [log_category] == "audit" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "audit-logs-%{+yyyy.MM.dd}"
    }
  }

  stdout { codec => rubydebug }
}
